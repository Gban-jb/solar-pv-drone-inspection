[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-pv-inspection"
version = "0.1.0"
description = "Student 1 solar PV drone inspection prototype"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=11,<14",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
ui = ["streamlit>=1.53,<2", "streamlit-drawable-canvas>=0.13,<0.14"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.22,<1"]

[project.scripts]
solar-pv-import = "solar_pv.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solar_pv.ui" = ["assets/drawings/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
