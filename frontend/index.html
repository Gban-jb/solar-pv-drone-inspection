<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Alabama A&M University research prototype for drone-based RGB and thermal solar panel inspection.">
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%brand/favicon-small.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%brand/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%brand/apple-touch-icon.png">
    <meta name="color-scheme" content="light dark">
    <title>Solar PV Inspection · Alabama A&amp;M University</title>
    <style>html {background:#f7f5f3} html[data-theme=dark]{background:#171619}</style>
    <script>
      (() => {
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        let preference;
        try { preference = localStorage.getItem('solar-theme'); } catch {}
        document.documentElement.dataset.theme = preference === 'dark' || preference === 'light' ? preference : system;
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
